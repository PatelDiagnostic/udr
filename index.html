
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Patel Diagnostic - Secure Billing</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <style>
        :root { --main-blue: #0b4ea2; --main-red: #d71920; }
        body { font-family: 'Arial', sans-serif; margin: 0; background: #525659; color: #333; overflow: hidden; }
        
        /* LOGIN OVERLAY */
        #login-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: var(--main-blue); display: flex; justify-content: center; align-items: center;
            z-index: 9999; transition: 0.5s;
        }
        .login-box {
            background: white; padding: 40px; border-radius: 8px; text-align: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3); width: 320px;
        }
        .login-box h2 { color: var(--main-blue); margin-bottom: 20px; }
        .login-box input { width: 100%; padding: 12px; margin-bottom: 15px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
        .login-box button { width: 100%; padding: 12px; background: var(--main-red); color: white; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; }

        /* MAIN APP LAYOUT */
        #main-app { display: none; height: 100vh; }
        #admin-panel { width: 400px; background: #ffffff; padding: 15px; border-right: 1px solid #ccc; overflow-y: auto; height: 100vh; box-sizing: border-box; }
        .input-group { margin-bottom: 10px; }
        label { display: block; font-weight: bold; font-size: 12px; margin-bottom: 3px; }
        .req { color: var(--main-red); }
        input[type="text"], input[type="number"], .search-box { width: 100%; padding: 8px; border: 1px solid #aaa; border-radius: 4px; box-sizing: border-box; }
        
        .manual-entry { background: #f0f7ff; padding: 10px; border: 1px solid #0b4ea2; border-radius: 4px; margin: 10px 0; }
        .test-selector { height: 200px; border: 1px solid #ccc; overflow-y: auto; padding: 10px; background: #f9f9f9; }
        .test-item { display: flex; align-items: center; margin-bottom: 5px; font-size: 12px; border-bottom: 1px solid #eee; }
        
        button.action-btn { width: 100%; padding: 10px; margin-top: 8px; border: none; border-radius: 4px; font-weight: bold; cursor: pointer; color: white; }

        /* PREVIEW AREA */
        #preview-area { flex-grow: 1; display: flex; justify-content: center; padding: 20px; overflow-y: auto; width: 100%; }
        #invoice-paper { width: 210mm; height: 297mm; background: white; box-shadow: 0 0 20px rgba(0,0,0,0.5); }
        #invoice-content { width: 100%; height: 148.5mm; padding: 10mm 15mm; box-sizing: border-box; position: relative; border-bottom: 1px dashed #ccc; }

        /* BRANDING (LOCKED SVG) */
        .inv-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 3px solid var(--main-blue); padding-bottom: 10px; }
        .logo-svg { width: 230px; }
        .lab-info { text-align: right; }
        .lab-info h3 { margin: 0; color: var(--main-red); font-size: 14px; }
        .lab-info p { margin: 1px 0; font-size: 11px; font-weight: bold; }
        
        .patient-box { display: grid; grid-template-columns: 1.2fr 0.8fr; gap: 10px; margin: 15px 0; padding: 10px; border: 1px solid #333; }
        .p-detail { font-size: 13px; margin: 2px 0; }
        
        table { width: 100%; border-collapse: collapse; }
        th { background: var(--main-blue); color: white; padding: 6px; text-align: left; font-size: 12px; }
        td { padding: 6px; border: 1px solid #eee; font-size: 12px; }
        .total-row { margin-top: 10px; text-align: right; border-top: 2px solid #000; padding-top: 5px; font-size: 16px; font-weight: bold; color: var(--main-blue); }
        .footer { position: absolute; bottom: 8mm; width: calc(100% - 30mm); text-align: center; font-size: 9px; border-top: 1px solid #ddd; }

        @media print {
            #login-overlay, #admin-panel { display: none; }
            #main-app { display: block; }
            #preview-area { padding: 0; }
            #invoice-paper { box-shadow: none; }
            #invoice-content { border-bottom: none; }
        }
    </style>
</head>
<body>

<div id="login-overlay">
    <div class="login-box">
        <div style="width: 100px; margin: 0 auto 15px;">
             <svg viewBox="0 0 24 24" fill="var(--main-blue)" width="50"><path d="M18 8h-1V6c0-2.76-2.24-5-5-5S7 3.24 7 6v2H6c-1.1 0-2 .9-2 2v10c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V10c0-1.1-.9-2-2-2zm-6 9c-1.1 0-2-.9-2-2s.9-2 2-2 2 .9 2 2-.9 2-2 2zm3.1-9H8.9V6c0-1.71 1.39-3.1 3.1-3.1 1.71 0 3.1 1.39 3.1 3.1v2z"/></svg>
        </div>
        <h2>Lab Login</h2>
        <input type="password" id="pass-input" placeholder="Enter Password">
        <button onclick="checkPass()">Access System</button>
        <p id="error-msg" style="color:red; font-size:12px; margin-top:10px; display:none;">Invalid Password!</p>
    </div>
</div>

<div id="main-app" style="display: none;">
    <div id="admin-panel">
        <h2 style="color: var(--main-blue); margin: 0 0 10px 0;">Billing Dashboard</h2>
        
        <div class="input-group">
            <label>Patient Name <span class="req">*</span></label>
            <input type="text" id="in-name" oninput="updateAll()">
        </div>
        <div class="input-group">
            <label>Contact No. <span class="req">*</span></label>
            <input type="text" id="in-phone" oninput="updateAll()">
        </div>
        <div class="input-group">
            <label>Bill No: <span id="bill-display"></span></label>
            <button style="font-size:10px; padding:2px; background:#eee;" onclick="manualSync()">Change Serial</button>
        </div>

        <div class="manual-entry">
            <label style="color: var(--main-blue);">+ Custom Test</label>
            <input type="text" id="custom-name" placeholder="Test Name" style="margin-bottom:5px;">
            <input type="number" id="custom-price" placeholder="Price (₹)">
            <button class="action-btn" style="background:var(--main-blue); width:auto;" onclick="addCustomTest()">Add</button>
        </div>

        <label>Search Tests</label>
        <input type="text" class="search-box" id="test-search" placeholder="Filter list..." onkeyup="filterTests()">
        <div class="test-selector" id="test-list"></div>

        <button class="action-btn" style="background:var(--main-blue);" onclick="window.print()">Print Upper A4</button>
        <button class="action-btn" style="background:#28a745;" onclick="exportPDF()">Download PDF</button>
        <button class="action-btn" style="background:#6c757d;" onclick="location.reload()">Lock & Log Out</button>
    </div>

    <div id="preview-area">
        <div id="invoice-paper">
            <div id="invoice-content">
                <div class="inv-header">
                    <div class="logo-svg">
                        <svg viewBox="0 0 600 300" xmlns="http://www.w3.org/2000/svg">
                            <circle cx="300" cy="150" r="120" fill="none" stroke="#1da1f2" stroke-width="10"/>
                            <circle cx="300" cy="150" r="135" fill="none" stroke="#1da1f2" stroke-width="4"/>
                            <circle cx="300" cy="150" r="105" fill="none" stroke="#1da1f2" stroke-width="4"/>
                            <rect x="90" y="120" rx="12" ry="12" width="420" height="60" fill="#ffffff"/>
                            <text x="300" y="162" text-anchor="middle" font-family="Arial Black, sans-serif" font-size="40" font-weight="900">
                                <tspan fill="#0b4ea2">Patel Diagnostic </tspan>
                                <tspan fill="#d71920">Udaipur</tspan>
                            </text>
                        </svg>
                    </div>
                    <div class="lab-info">
                        <h3>Home Blood Collection</h3>
                        <p>8209746239</p>
                        <p>Udaipur, Rajasthan</p>
                    </div>
                </div>

                <div class="patient-box">
                    <div>
                        <p class="p-detail"><b>Patient:</b> <span id="out-name">________________</span></p>
                        <p class="p-detail"><b>Contact:</b> <span id="out-phone">________________</span></p>
                    </div>
                    <div style="text-align: right;">
                        <p class="p-detail"><b>Bill No:</b> <span id="out-bill"></span></p>
                        <p class="p-detail"><b>Date:</b> <span id="out-date"></span></p>
                    </div>
                </div>

                <table>
                    <thead>
                        <tr><th style="width:30px;">#</th><th>Investigation</th><th style="text-align:right;">Price (₹)</th></tr>
                    </thead>
                    <tbody id="out-table"></tbody>
                </table>
                <div class="total-row">Net Payable: ₹ <span id="out-total">0.00</span></div>
                <div class="footer">
                    <p>* Computer generated invoice. Thank you for choosing Patel Diagnostic.</p>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
    const MASTER_PASS = "Patel@2025"; // Change this password here
    let customTests = [] ;

    function checkPass() {
        const input = document.getElementById('pass-input').value;
        if(input === MASTER_PASS) {
            document.getElementById('login-overlay').style.display = 'none';
            document.getElementById('main-app').style.display = 'flex';
            initApp();
        } else {
            document.getElementById('error-msg').style.display = 'block';
        }
    }

    // Trigger login on 'Enter' key
    document.getElementById('pass-input').addEventListener('keypress', function (e) {
        if (e.key === 'Enter') checkPass();
    });

    function initApp() {
        if(!localStorage.getItem('pdSerial')) localStorage.setItem('pdSerial', '1001');
        const list = document.getElementById('test-list');
        db.forEach(t => {
            list.innerHTML += `<div class="test-item" data-search="${t.n.toLowerCase()}">
                <input type="checkbox" class="t-chk" data-n="${t.n}" data-p="${t.p}" onchange="updateAll()">
                <span>${t.n} (₹${t.p})</span>
            </div>`;
        });
        updateAll();
        setInterval(() => { document.getElementById('out-date').innerText = new Date().toLocaleString('en-IN'); }, 1000);
    }

    function addCustomTest() {
        const name = document.getElementById('custom-name').value;
        const price = document.getElementById('custom-price').value;
        if(name && price) {
            customTests.push({n: name, p: parseFloat(price)});
            document.getElementById('custom-name').value = "";
            document.getElementById('custom-price').value = "";
            updateAll();
        }
    }

    function updateAll() {
        const serial = localStorage.getItem('pdSerial');
        const bill = "PD-2025-" + serial;
        document.getElementById('bill-display').innerText = bill;
        document.getElementById('out-bill').innerText = bill;
        document.getElementById('out-name').innerText = document.getElementById('in-name').value || "________________";
        document.getElementById('out-phone').innerText = document.getElementById('in-phone').value || "________________";
        
        let total = 0, rows = "", count = 1;
        document.querySelectorAll('.t-chk:checked').forEach(c => {
            total += parseFloat(c.dataset.p);
            rows += `<tr><td>${count++}</td><td>${c.dataset.n}</td><td style="text-align:right;">${parseFloat(c.dataset.p).toFixed(2)}</td></tr>`;
        });
        customTests.forEach(t => {
            total += t.p;
            rows += `<tr><td>${count++}</td><td>${t.n}</td><td style="text-align:right;">${t.p.toFixed(2)}</td></tr>`;
        });
        document.getElementById('out-table').innerHTML = rows;
        document.getElementById('out-total').innerText = total.toFixed(2);
    }

    function exportPDF() {
        const name = document.getElementById('in-name').value || "Patient";
        html2pdf().set({
            margin: 0,
            filename: `${name}_Bill.pdf`,
            html2canvas: { scale: 3 },
            jsPDF: { unit: 'mm', format: 'a4', orientation: 'portrait' }
        }).from(document.getElementById('invoice-content')).save().then(() => {
            localStorage.setItem('pdSerial', parseInt(localStorage.getItem('pdSerial')) + 1);
            updateAll();
        });
    }

    function manualSync() {
        const val = prompt("Enter new starting number:");
        if(val) { localStorage.setItem('pdSerial', val); updateAll(); }
    }

    function filterTests() {
        let val = document.getElementById('test-search').value.toLowerCase();
        document.querySelectorAll('.test-item').forEach(item => {
            item.style.display = item.dataset.search.includes(val) ? "flex" : "none";
        });
    }
</script>
</body>
</html>
