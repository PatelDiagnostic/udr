<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Patel Diagnostic | Report Management System</title>
    <script src="https://unpkg.com/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script>
    <style>
        :root {
            --primary-blue: #0056b3;
            --success-green: #28a745;
            --bg-light: #f4f7f9;
            --white: #ffffff;
            --text-dark: #2d3436;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-light);
            color: var(--text-dark);
            margin: 0;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        /* Professional Header */
        header {
            background-color: var(--white);
            border-bottom: 3px solid var(--primary-blue);
            padding: 1rem 5%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
        }

        .brand-title {
            color: var(--primary-blue);
            font-weight: 800;
            font-size: 1.5rem;
            margin: 0;
            letter-spacing: 1px;
        }

        main {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 40px 20px;
        }

        .card {
            background: var(--white);
            width: 100%;
            max-width: 550px;
            padding: 35px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.08);
            text-align: center;
        }

        .header-preview {
            width: 100%;
            border: 1px solid #eee;
            border-radius: 5px;
            margin-bottom: 25px;
            padding: 5px;
        }

        .upload-section {
            margin-bottom: 25px;
            text-align: left;
        }

        label {
            display: block;
            font-weight: 600;
            margin-bottom: 10px;
            font-size: 0.9rem;
        }

        input[type="file"] {
            width: 100%;
            padding: 12px;
            border: 2px dashed #cbd5e1;
            border-radius: 10px;
            background: #fafafa;
            cursor: pointer;
            box-sizing: border-box;
        }

        .btn {
            width: 100%;
            padding: 15px;
            font-size: 1.1rem;
            font-weight: 700;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 10px;
        }

        .btn-process {
            background-color: var(--primary-blue);
            color: white;
        }

        .btn-process:hover {
            background-color: #004494;
            transform: translateY(-2px);
        }

        .btn-download {
            background-color: var(--success-green);
            color: white;
        }

        #status {
            margin: 20px 0;
            font-weight: 600;
        }

        .hidden { display: none; }

        footer {
            padding: 20px;
            text-align: center;
            font-size: 0.85rem;
            color: #636e72;
        }
    </style>
</head>
<body>

<header>
    <h1 class="brand-title">PATEL DIAGNOSTIC UDAIPUR</h1>
    <span style="font-size: 0.8rem; color: #636e72;">Report Generator v2.0</span>
</header>

<main>
    <div class="card">
        <h3>Letterhead Preview</h3>
        <img id="headerLogo" class="header-preview" src="Letter Head.JPG" alt="Patel Diagnostic Letterhead">
        
        <div class="upload-section">
            <label for="pdfInput">Upload Lab Report (PDF)</label>
            <input type="file" id="pdfInput" accept="application/pdf">
        </div>

        <button class="btn btn-process" onclick="processReport()">Apply Letterhead</button>

        <div id="status"></div>
        
        <div id="downloadArea" class="hidden">
            <button class="btn btn-download" onclick="downloadPDF()">Download Final Report</button>
        </div>
    </div>
</main>

<footer>
    &copy; 2026 Patel Diagnostic. Private & Confidential. All processing occurs locally in-browser.
</footer>

<script>
    const { PDFDocument } = PDFLib;
    let processedPdfBytes = null;
    let currentFileName = "report.pdf";

    async function processReport() {
        const status = document.getElementById('status');
        const pdfInput = document.getElementById('pdfInput');
        const headerImg = document.getElementById('headerLogo');

        if (!pdfInput.files[0]) {
            status.innerHTML = '<span style="color: #e74c3c;">Error: Please select a PDF file.</span>';
            return;
        }

        try {
            status.innerHTML = '<span style="color: var(--primary-blue);">Processing Report...</span>';
            currentFileName = pdfInput.files[0].name;

            // Load PDF
            const pdfData = await pdfInput.files[0].arrayBuffer();
            const pdfDoc = await PDFDocument.load(pdfData);

            // Load the default image from the page
            const response = await fetch(headerImg.src);
            const imageBytes = await response.arrayBuffer();
            
            // Embed image (Note: Using JPG embed as per your file extension)
            const embeddedImage = await pdfDoc.embedJpg(imageBytes);
            const imageDims = embeddedImage.scale(1);

            const pages = pdfDoc.getPages();
            
            // Apply to all pages
            for (const page of pages) {
                const { width, height } = page.getSize();
                
                // Scale width to page width
                const drawWidth = width;
                const drawHeight = (imageDims.height / imageDims.width) * width;

                page.drawImage(embeddedImage, {
                    x: 0,
                    y: height - drawHeight,
                    width: drawWidth,
                    height: drawHeight,
                });
            }

            processedPdfBytes = await pdfDoc.save();
            status.innerHTML = '<span style="color: var(--success-green);">Letterhead Applied Successfully!</span>';
            document.getElementById('downloadArea').classList.remove('hidden');

        } catch (err) {
            console.error(err);
            status.innerHTML = '<span style="color: #e74c3c;">Error processing PDF. Ensure "Letter Head.JPG" is in the same folder.</span>';
        }
    }

    function downloadPDF() {
        if (!processedPdfBytes) return;
        const blob = new Blob([processedPdfBytes], { type: "application/pdf" });
        const url = URL.createObjectURL(blob);
        const link = document.createElement("a");
        link.href = url;
        link.download = currentFileName;
        link.click();
    }
</script>

</body>
</html>
