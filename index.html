<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Vijay Path Lab | Proportional Overlay</title>
    <script src="https://unpkg.com/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, sans-serif;
            background-color: #f1f5f9;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }
        .card {
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 450px;
            border-top: 6px solid #d32f2f;
        }
        h2 { color: #1e293b; margin: 0 0 20px 0; text-align: center; font-size: 20px; }
        .input-group { margin-bottom: 15px; }
        label { display: block; font-size: 11px; font-weight: bold; color: #64748b; margin-bottom: 5px; text-transform: uppercase; }
        
        /* IPHONE FIX: Font size 16px prevents auto-zooming on focus */
        input[type="file"] { 
            width: 100%; 
            border: 1px solid #cbd5e1; 
            padding: 8px; 
            border-radius: 6px; 
            font-size: 16px; 
            box-sizing: border-box;
        }
        
        #processBtn {
            background-color: #d32f2f;
            color: white;
            border: none;
            padding: 15px;
            border-radius: 8px;
            width: 100%;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
            transition: background 0.2s;
        }
        #processBtn:hover { background-color: #b91c1c; }
        #processBtn:disabled { background-color: #94a3b8; cursor: not-allowed; }
        #status { margin-top: 15px; text-align: center; font-size: 14px; color: #475569; font-weight: 500; word-break: break-all; }
        
        /* Styling for the backup download link */
        .download-link {
            display: inline-block;
            margin-top: 5px;
            color: #d32f2f;
            text-decoration: underline;
            cursor: pointer;
        }
    </style>
</head>
<body>

<div class="card">
    <h2>Branding Overlay Tool</h2>
    
    <div class="input-group">
        <label>1. Select Report (PDF)</label>
        <input type="file" id="pdfInput" accept="application/pdf">
    </div>

    <button id="processBtn" disabled>Generate Branded PDF</button>
    <div id="status">Ready</div>
</div>

<script>
    const pdfInput = document.getElementById('pdfInput');
    const processBtn = document.getElementById('processBtn');
    const status = document.getElementById('status');

    // Hosted image URLs (ensure these files are in the same folder as this HTML file on your server)
    const headerImageUrl = 'header.jpg';
    const footerImageUrl = 'footer.jpg';

    function checkFiles() {
        processBtn.disabled = !(pdfInput.files.length > 0);
    }

    pdfInput.addEventListener('change', checkFiles);

    // Fetch images directly from your web host
    async function embedHostedImage(pdfDoc, url) {
        const res = await fetch(url);
        if (!res.ok) throw new Error(`Failed to load image from ${url}`);
        const bytes = await res.arrayBuffer();
        return url.toLowerCase().includes(".png") ? await pdfDoc.embedPng(bytes) : await pdfDoc.embedJpg(bytes);
    }

    processBtn.addEventListener('click', async () => {
        status.innerText = "Processing...";
        processBtn.disabled = true;

        try {
            const originalFile = pdfInput.files[0];
            const pdfBytes = await originalFile.arrayBuffer();
            const pdfDoc = await PDFLib.PDFDocument.load(pdfBytes);

            // Fetch the hosted images
            const headerImg = await embedHostedImage(pdfDoc, headerImageUrl);
            const footerImg = await embedHostedImage(pdfDoc, footerImageUrl);

            const headerDims = headerImg.scale(1);
            const footerDims = footerImg.scale(1);

            const pages = pdfDoc.getPages();
            pages.forEach(page => {
                const { width, height } = page.getSize();
                
                const hScale = width / headerDims.width;
                const hFinalHeight = headerDims.height * hScale;

                const fScale = width / footerDims.width;
                const fFinalHeight = footerDims.height * fScale;

                page.drawImage(headerImg, {
                    x: 0,
                    y: height - hFinalHeight,
                    width: width,
                    height: hFinalHeight
                });

                page.drawImage(footerImg, {
                    x: 0,
                    y: 0,
                    width: width,
                    height: fFinalHeight
                });
            });

            const modifiedPdfBytes = await pdfDoc.save();
            
            // Filename matching logic
            const originalName = originalFile.name.replace(/\.[^/.]+$/, ""); 
            const downloadName = `${originalName}_branded.pdf`;

            const blob = new Blob([modifiedPdfBytes], { type: 'application/pdf' });
            const blobUrl = URL.createObjectURL(blob);
            
            const link = document.createElement('a');
            link.href = blobUrl;
            link.download = downloadName;
            
            // IPHONE FIX: Append link to body is required for iOS Safari
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);

            // IPHONE FIX: Backup Manual Link
            status.innerHTML = `Success! <br><a href="${blobUrl}" download="${downloadName}" class="download-link">Click here if download didn't start</a>`;
            
            processBtn.disabled = false;
        } catch (err) {
            console.error(err);
            status.innerText = "Error. Please check if header.jpg and footer.jpg are uploaded to the server.";
            processBtn.disabled = false;
        }
    });
</script>

</body>
</html>
